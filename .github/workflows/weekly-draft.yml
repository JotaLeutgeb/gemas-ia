name: weekly-draft

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run charts
      - name: Generate weekly LinkedIn draft
        run: node scripts/generate-weekly-draft.mjs
      - name: Commit draft
        run: |
          git config user.name "gemas-ia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/linkedin
          if git diff --cached --quiet; then
            echo "No draft to commit"
          else
            git commit -m "content: weekly draft $(date -u +%F)"
            git push
          fi
