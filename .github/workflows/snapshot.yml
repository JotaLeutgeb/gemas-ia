name: snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
      - run: npm run build:dataset
      - run: npm run charts
      - run: npm test
      - name: Commit snapshots
        run: |
          git config user.name "gemas-ia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots public/data/dataset.json public/charts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push
          fi
