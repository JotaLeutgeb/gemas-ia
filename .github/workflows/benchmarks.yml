name: benchmarks

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmarks
      - run: npm run build:dataset
      - name: Commit benchmark snapshot
        run: |
          git config user.name "gemas-ia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/benchmarks public/data/dataset.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: benchmarks $(date -u +%F)"
            git push
          fi
